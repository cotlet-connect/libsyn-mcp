[project]
name = "libsyn-mcp"
version = "1.1.0"
description = "Connect Libsyn to ChatGPT, Claude, Codex and Claude Code through Cotlet.dev, a hosted MCP server. No Libsyn API key needed."
readme = "README.md"
license = "Elastic-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Cotlet.dev", email = "contact@cotlet.dev" }]
keywords = ["libsyn", "libsyn api", "libsyn mcp", "mcp server", "claude", "chatgpt", "ai agent", "cotlet"]
classifiers = ["Programming Language :: Python :: 3", "Topic :: Office/Business"]
dependencies = []

[project.urls]
Homepage = "https://cotlet.dev/integrations/libsyn-api-mcp-server?utm_source=pypi&utm_medium=package&utm_campaign=libsyn"
Source = "https://github.com/cotlet-connect/libsyn-mcp"

[project.scripts]
libsyn-mcp = "libsyn_agent:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"libsyn_agent.py" = "libsyn_agent.py"

[tool.hatch.build.targets.sdist]
include = ["libsyn_agent.py", "README.md", "LICENSE", "mcp.json", "Dockerfile", "glama.json", "skills", "examples", ".cursor"]
